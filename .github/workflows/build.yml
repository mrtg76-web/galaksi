name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Core tests
        run: |
          cmake -B build -DGK_BUILD_PLUGIN=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j4
          ctest --test-dir build --output-on-failure

  macos:
    needs: tests
    # GitHub'ın macOS makineleri bazen dolu oluyor: iki tür dene, biri yeter
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: "Configure (universal - Apple Silicon + Intel/Rosetta)"
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 -DGK_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build --config Release --target Galaksi_VST3 Galaksi_AU Galaksi_Standalone -j4
      - name: Sign (ad-hoc) and package
        run: |
          A=build/Galaksi_artefacts/Release
          codesign --force --deep -s - "$A/VST3/Galaksi.vst3"
          codesign --force --deep -s - "$A/AU/Galaksi.component"
          codesign --force --deep -s - "$A/Standalone/Galaksi.app"
          mkdir -p dist
          ditto "$A/VST3/Galaksi.vst3" dist/Galaksi.vst3
          ditto "$A/AU/Galaksi.component" dist/Galaksi.component
          ditto "$A/Standalone/Galaksi.app" dist/Galaksi.app
          cp README.md dist/KURULUM.md
          lipo -info "$A/VST3/Galaksi.vst3/Contents/MacOS/Galaksi"
      - name: Publish latest build to release "son-surum"
        if: matrix.runner == 'macos-latest' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && ditto -c -k --sequesterRsrc . ../Galaksi-mac.zip)
          gh release view son-surum >/dev/null 2>&1 || gh release create son-surum --title "Son sürüm (otomatik)" --notes "main dalının en son Mac derlemesi" --latest
          gh release upload son-surum Galaksi-mac.zip --clobber
      - uses: actions/upload-artifact@v5
        with:
          name: Galaksi-mac-${{ matrix.runner }}
          path: dist

  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build -DGK_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build --config Release --target Galaksi_VST3 Galaksi_Standalone
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp -r build/Galaksi_artefacts/Release/VST3/Galaksi.vst3 dist/
          cp build/Galaksi_artefacts/Release/Standalone/Galaksi.exe dist/ || true
      - uses: actions/upload-artifact@v5
        with:
          name: Galaksi-windows
          path: dist
